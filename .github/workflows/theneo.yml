name: Push to Theneo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push-openapi-to-theneo:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Theneo CLI
        run: npm install -g @theneo/cli@latest
      
      - name: Login to Theneo (Dev)
        run: |
          echo "Logging in to Theneo (Dev)..."
          theneo login --token 7063a11a-2a5a-4316-abc2-14edbee51c30 --api-url https://api.theneo.io --app-url https://app.theneo.io
      
      
      - name: Push docs to Theneo
        run: |
          echo "Pushing docs to Theneo..."
          theneo project import \
            --file /Users/marieedelstein/Desktop/API Specs/openapi (7).yaml
            --project github-actions-1 \
            --publish \
